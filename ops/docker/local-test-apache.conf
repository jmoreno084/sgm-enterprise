ServerRoot /etc/apache2
ServerName localhost
PidFile /var/lib/sgpm/apache.pid
DefaultRuntimeDir /var/lib/sgpm
IncludeOptional /etc/apache2/mods-enabled/*.load
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
LoadModule socache_shmcb_module /usr/lib/apache2/modules/mod_socache_shmcb.so
Include /etc/apache2/mods-available/headers.load
Include /etc/apache2/mods-enabled/php7.0.conf
User www-data
Group www-data
TypesConfig /etc/mime.types
DirectoryIndex index.php
ErrorLog /proc/self/fd/2
LogLevel warn
Listen 0.0.0.0:18080
Listen 0.0.0.0:18443
SSLSessionCache none
PassEnv SGPM_ENV SGPM_DSN SGPM_DB_USER SGPM_DB_PASSWORD SGPM_BASE_URL SGPM_EMAIL_MODE SGPM_ENCRYPTION_KEY SGPM_MAC_KEY SGPM_TEST_DATABASE
<Directory />
 Require all denied
</Directory>
<VirtualHost *:18080>
 Redirect permanent / https://localhost:18443/
</VirtualHost>
<VirtualHost *:18443>
 DocumentRoot /workspace/public
 SSLEngine on
 SSLCertificateFile /etc/sgpm-local/server.crt
 SSLCertificateKeyFile /etc/sgpm-local/server.key
 SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
 Header always set Strict-Transport-Security "max-age=31536000"
 Header always set X-Content-Type-Options "nosniff"
 Header always set Referrer-Policy "same-origin"
 php_flag display_errors Off
 php_value session.save_path /var/lib/sgpm/sessions
 <Directory /workspace/public>
  Require all granted
  AllowOverride None
  Options -Indexes -MultiViews
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ index.php [QSA,L]
 </Directory>
 <FilesMatch "^\.">
  Require all denied
 </FilesMatch>
</VirtualHost>
