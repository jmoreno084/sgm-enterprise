# Referencia para Apache 2.4.18; adaptar dominio/rutas/certificado antes de habilitar.
<VirtualHost *:80>
    ServerName sgpm.example.invalid
    Redirect permanent / https://sgpm.example.invalid/
</VirtualHost>
<VirtualHost *:443>
    ServerName sgpm.example.invalid
    DocumentRoot /var/www/sgpm/public
    SSLEngine on
    SSLCertificateFile /etc/ssl/sgpm/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/sgpm/private.key
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.arcgisonline.com https://*.google.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://*.tile.openstreetmap.org https://*.arcgisonline.com https://*.googleapis.com https://*.gstatic.com; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Header always set Referrer-Policy "same-origin"
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/geo+json text/html text/css application/javascript text/javascript
    </IfModule>
    <Directory /var/www/sgpm>
        Require all denied
    </Directory>
    <Directory /var/www/sgpm/public>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    php_flag display_errors Off
    php_flag session.use_strict_mode On
    php_value session.save_path /var/www/sgpm/storage/sessions
    # Para FPM sustituir las tres directivas php_* por configuración equivalente en pool.
    ErrorLog /var/log/apache2/sgpm-error.log
    CustomLog /var/log/apache2/sgpm-access.log combined
</VirtualHost>

